<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Песни учеников</title>
  <meta name="robots" content="noindex, nofollow">
  <!-- Личные ссылки не должны передаваться внешним ресурсам. -->
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
  <link rel="stylesheet" href="assets/fonts/fonts.css?v=local1">
  <link rel="stylesheet" href="style.css?v=garden1">
  <link rel="stylesheet" href="garden.css?v=spaces1">
</head>
<body>
  <header class="studio-header">
    <div class="studio-brand"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 27V14m0 5C5 19 3 10 6 5c8-1 12 5 10 14zm0-4c0-8 4-12 11-11 2 7-3 13-11 11z"/></svg><div>Сад звука<span>место, где растёт голос</span></div></div>
    <span class="studio-motto"><span>Твой голос.</span><span>Твой звук.</span></span>
    <label class="interface-scale-control"><span aria-hidden="true">Aa</span>
      <select class="interface-scale" aria-label="Масштаб интерфейса">
        <option value="85">85%</option><option value="90">90%</option>
        <option value="100" selected>100%</option><option value="110">110%</option>
        <option value="125">125%</option><option value="150">150%</option>
      </select>
    </label>
  </header>
  <main id="main"></main>

  <div id="player" class="player" hidden>
    <div class="p-info">
      <div class="p-impulse" hidden></div>
      <div class="p-title"></div>
      <div class="p-sub"></div>
    </div>
    <div class="p-controls">
      <button class="p-btn p-back" aria-label="Назад на 5 секунд" title="Назад на 5 с">
        <svg class="skip-icon" viewBox="0 0 32 32" aria-hidden="true"><path class="skip-ring" d="M16 6a10 10 0 1 1-7.07 2.93"/><path class="skip-arrow" d="M16 2l-5 5 5 5z"/><path class="skip-number" d="M18 12h-4v4h2a2 2 0 0 1 0 4h-2"/></svg>
      </button>
      <button class="p-btn p-play" aria-label="Играть">
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10-6.5z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="5" width="3.5" height="14" rx="1"/><rect x="13.5" y="5" width="3.5" height="14" rx="1"/></svg>
      </button>
      <button class="p-btn p-fwd" aria-label="Вперёд на 5 секунд" title="Вперёд на 5 с">
        <svg class="skip-icon" viewBox="0 0 32 32" aria-hidden="true"><g transform="translate(32 0) scale(-1 1)"><path class="skip-ring" d="M16 6a10 10 0 1 1-7.07 2.93"/><path class="skip-arrow" d="M16 2l-5 5 5 5z"/></g><path class="skip-number" d="M18 12h-4v4h2a2 2 0 0 1 0 4h-2"/></svg>
      </button>
    </div>
    <div class="p-metro" hidden>
      <span class="m-dot" aria-hidden="true"></span>
      <span class="m-bpm">…</span>
      <span class="m-status muted small"></span>
      <span class="m-tools">
        <label class="m-tempo">BPM <input class="m-bpm-input" type="text" inputmode="decimal" aria-label="Точный темп BPM" title="Точный темп фонограммы. После ввода нажмите «Попасть в долю»." placeholder="120"></label>
        <button class="m-btn" data-act="half" title="Вдвое медленнее">½</button>
        <button class="m-btn" data-act="double" title="Вдвое быстрее">×2</button>
        <button class="m-btn wide" data-act="align" title="Во время песни нажмите точно на долю — щелчки сдвинутся туда">Попасть в долю</button>
        <button class="m-btn" data-act="earlier" title="Щелчки на 10 мс раньше" aria-label="Щелчки на 10 миллисекунд раньше">−10 мс</button>
        <button class="m-btn" data-act="later" title="Щелчки на 10 мс позже" aria-label="Щелчки на 10 миллисекунд позже">+10 мс</button>
        <button class="m-btn wide" data-act="tapTempo" title="Постучите по кнопке в такт 6–8 раз — сайт возьмёт ваш темп">Настучать</button>
        <button class="m-btn wide" data-act="auto" title="Определить темп по записи заново">Авто</button>
        <button class="m-btn wide" data-act="save" hidden title="Сохранить проверенные доли этой записи для учеников">Сохранить доли</button>
        <input class="m-vol" type="range" min="0" max="1" step="0.05" value="0.6" aria-label="Громкость метронома" title="Громкость метронома">
      </span>
    </div>
    <div class="p-waveform"><canvas class="waveform-canvas" role="img" aria-label="Волновая форма выбранной записи"></canvas><button type="button" class="waveform-status" aria-label="Построить звуковую волну записи"></button></div>
    <div class="p-timeline">
      <span class="p-cur">0:00</span>
      <input class="p-seek" type="range" min="0" max="1000" value="0" aria-label="Позиция">
      <span class="p-dur">0:00</span>
    </div>
    <div class="p-extra">
      <button class="p-btn small p-metro-btn" aria-label="Метроном к песне" aria-pressed="false" title="Метроном">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2h4l5 19H5L10 2zm1.6 2L8.4 16h7.2L12.4 4h-.8zM7.9 18l-.5 1h9.2l-.5-1H7.9zM12 13l5.5-8.5 1.3.8L13.6 13H12z"/></svg>
      </button>
      <button class="p-btn small p-loop" aria-label="Повторять песню" aria-pressed="false" title="Повторять">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg>
      </button>
      <select class="p-speed" aria-label="Скорость" title="Скорость (тон не меняется)">
        <option value="0.75">0.75×</option>
        <option value="0.85">0.85×</option>
        <option value="1" selected>1×</option>
        <option value="1.1">1.1×</option>
      </select>
      <a class="p-btn small p-dl" download aria-label="Скачать аудио" title="Скачать">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4h2v9l3.5-3.5 1.4 1.4L12 16.8l-5.9-5.9 1.4-1.4L11 13zM5 18h14v2H5z"/></svg>
      </a>
      <button class="p-btn small p-close" aria-label="Закрыть плеер" title="Закрыть">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4L12 13.4 6.4 19 5 17.6l5.6-5.6L5 6.4z"/></svg>
      </button>
    </div>
  </div>

  <script type="module" src="app.js?v=spaces1"></script>
</body>
</html>
