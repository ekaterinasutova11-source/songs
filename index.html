<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Песни учеников</title>
  <meta name="robots" content="noindex, nofollow">
  <!-- Яндекс Диск не отдаёт файлы, если в запросе указан адрес github.io -->
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="main"></main>

  <div id="player" class="player" hidden>
    <div class="p-info">
      <div class="p-impulse" hidden></div>
      <div class="p-title"></div>
      <div class="p-sub"></div>
    </div>
    <div class="p-controls">
      <button class="p-btn p-back" aria-label="Назад на 5 секунд" title="Назад на 5 с">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/><text x="12" y="16.5" text-anchor="middle" font-size="7" font-weight="700">5</text></svg>
      </button>
      <button class="p-btn p-play" aria-label="Играть">
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
      </button>
      <button class="p-btn p-fwd" aria-label="Вперёд на 5 секунд" title="Вперёд на 5 с">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2l5 4-5 4V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/><text x="12" y="16.5" text-anchor="middle" font-size="7" font-weight="700">5</text></svg>
      </button>
    </div>
    <div class="p-metro" hidden>
      <span class="m-dot" aria-hidden="true"></span>
      <span class="m-bpm">…</span>
      <span class="m-status muted small"></span>
      <span class="m-tools">
        <button class="m-btn" data-act="half" title="Вдвое медленнее">½</button>
        <button class="m-btn" data-act="double" title="Вдвое быстрее">×2</button>
        <button class="m-btn" data-act="minus" title="Чуть медленнее">−</button>
        <button class="m-btn" data-act="plus" title="Чуть быстрее">+</button>
        <button class="m-btn wide" data-act="tap" title="Нажмите точно в момент доли — щелчки подстроятся">Попасть в долю</button>
        <input class="m-vol" type="range" min="0" max="1" step="0.05" value="0.6" aria-label="Громкость метронома" title="Громкость метронома">
      </span>
    </div>
    <div class="p-timeline">
      <span class="p-cur">0:00</span>
      <input class="p-seek" type="range" min="0" max="1000" value="0" aria-label="Позиция">
      <span class="p-dur">0:00</span>
    </div>
    <div class="p-extra">
      <button class="p-btn small p-metro-btn" aria-pressed="false" title="Метроном">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2h4l5 19H5L10 2zm1.6 2L8.4 16h7.2L12.4 4h-.8zM7.9 18l-.5 1h9.2l-.5-1H7.9zM12 13l5.5-8.5 1.3.8L13.6 13H12z"/></svg>
      </button>
      <button class="p-btn small p-loop" aria-pressed="false" title="Повторять">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg>
      </button>
      <select class="p-speed" aria-label="Скорость" title="Скорость (тон не меняется)">
        <option value="0.75">0.75×</option>
        <option value="0.85">0.85×</option>
        <option value="1" selected>1×</option>
        <option value="1.1">1.1×</option>
      </select>
      <a class="p-btn small p-dl" download title="Скачать">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4h2v9l3.5-3.5 1.4 1.4L12 16.8l-5.9-5.9 1.4-1.4L11 13zM5 18h14v2H5z"/></svg>
      </a>
      <button class="p-btn small p-close" aria-label="Закрыть плеер" title="Закрыть">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4L12 13.4 6.4 19 5 17.6l5.6-5.6L5 6.4z"/></svg>
      </button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
