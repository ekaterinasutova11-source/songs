limit_req_zone $binary_remote_addr zone=songs_api:10m rate=10r/s;
server {
    listen 80 default_server;
    server_name 135.106.183.211;
    server_tokens off;
    access_log off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://135.106.183.211$request_uri; }
}
server {
    listen 443 ssl default_server;
    server_name 135.106.183.211;
    ssl_certificate /etc/letsencrypt/live/songs-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/songs-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;
    client_max_body_size 256m;
    client_body_timeout 300s;
    root /var/www/songs;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location = /api {
        limit_req zone=songs_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
    location = /media {
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location = /upload {
        proxy_pass http://127.0.0.1:3000;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location = /healthz { proxy_pass http://127.0.0.1:3000; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; expires -1; }
}
