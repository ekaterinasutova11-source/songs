<h1>Сад звука</h1>
<p>Открываем вашу страницу на новом сервере. Личная ссылка и материалы сохранены.</p>
<p><a id="continue" href="https://135.106.183.211/" rel="noreferrer">Перейти на сайт</a></p>
<noscript><p>Для открытия личной страницы включите JavaScript. Самостоятельный переход без него не перенесёт личную часть ссылки.</p></noscript>
<script>
  // Fixed trusted destination: never read a redirect target from a query parameter.
  const destination = new URL('https://135.106.183.211/');
  destination.search = location.search;
  destination.hash = location.hash;
  document.getElementById('continue').href = destination.href;
  location.replace(destination.href);
</script>
